<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metamind Loading...</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Roboto:wght@300&display=swap" rel="stylesheet">
    <style>
        body, html {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: transparent;
            overflow: hidden;
            -webkit-app-region: drag;
        }
        .container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            background-color: transparent;
            width: 100%;
            height: 100%;
            border-radius: 20px;
        }
        .logo {
            width: 250px;
            height: 250px;
            animation: pulse 2.5s infinite ease-in-out;
        }
        .title {
            font-family: 'Orbitron', sans-serif;
            font-size: 36px;
            margin-top: 15px;
            color: #FFD700;
            text-shadow: 0 0 12px rgba(255, 215, 0, 0.7), 0 0 3px #000;
            animation: fadeIn 1.5s ease-in-out;
        }
        /* ✅ CORRECCIÓN: Simplificado a un solo elemento con ID */
        #status-text {
            font-family: 'Roboto', sans-serif;
            font-size: 18px;
            margin-top: 25px;
            color: #ccc;
            letter-spacing: 1px;
            animation: fadeIn 1.5s ease-in-out;
            min-height: 22px; /* Espacio reservado para evitar saltos de layout */
        }
        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Asegúrate de que la ruta al ícono sea correcta desde la raíz de tu proyecto -->
        <img src="./assets/icon2.png" alt="Loading Logo" class="logo">
        <h1 class="title">LOL META MIND</h1>
        <!-- ✅ CORRECCIÓN: Usamos un ID para que JavaScript pueda encontrarlo fácilmente -->
        <div id="status-text">Iniciando...</div>
    </div>

    <!-- ✅ SCRIPT AÑADIDO: Escucha los mensajes de carga desde main.js -->
    <script>
        const statusElement = document.getElementById('status-text');
        
        // La función 'onTtsStatusUpdate' fue expuesta en preload.js
        // y nos permite recibir mensajes del proceso principal de Electron.
        if (window.electronAPI && window.electronAPI.onTtsStatusUpdate) {
            window.electronAPI.onTtsStatusUpdate((message) => {
                console.log('Mensaje de estado recibido:', message);
                // Actualizamos el texto del div con el mensaje recibido.
                statusElement.textContent = message;
            });
        } else {
            console.error("Error: electronAPI.onTtsStatusUpdate no está disponible. Revisa tu preload.js");
            statusElement.textContent = "Error de comunicación.";
        }
    </script>
</body>
</html>
