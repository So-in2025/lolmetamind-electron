<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metamind Loading...</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Roboto:wght@300&display=swap" rel="stylesheet">
    <style>
        body, html {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: transparent;
            overflow: hidden;
            -webkit-app-region: drag;
        }
        .container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            /* Agregamos un fondo oscuro semitransparente para dar contraste */
            background-color: rgba(18, 18, 18, 0.9);
            width: 100%;
            height: 100%;
            border-radius: 20px; /* Bordes redondeados */
        }
        .logo {
            /* Hacemos el logo más grande */
            width: 250px;
            height: 250px;
            /* Animación de carga tipo 'respiración' */
            animation: pulse 2.5s infinite ease-in-out;
        }
        .title {
            font-family: 'Orbitron', sans-serif;
            font-size: 36px;
            margin-top: 15px;
            /* Color dorado con sombra para resaltar */
            color: #FFD700;
            text-shadow: 0 0 12px rgba(255, 215, 0, 0.7), 0 0 3px #000;
            animation: fadeIn 1.5s ease-in-out;
        }
        .loading-text {
            font-family: 'Roboto', sans-serif;
            font-size: 18px;
            margin-top: 25px;
            color: #ccc;
            letter-spacing: 2px;
            /* Animación de puntos suspensivos */
            animation: fadeIn 1.5s ease-in-out, dots 2s infinite step-end;
        }
        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes dots {
            0%, 20% { content: 'Cargando'; }
            40% { content: 'Cargando.'; }
            60% { content: 'Cargando..'; }
            80%, 100% { content: 'Cargando...'; }
        }
        /* Usamos un pseudo-elemento para la animación de los puntos */
        .loading-text::after {
            content: 'Cargando...';
            animation: dots 2s infinite step-start;
        }

    </style>
</head>
<body>
    <div class="container">
        <img src="./assets/icon2.png" alt="Loading Logo" class="logo">
        <h1 class="title">LOL META MIND</h1>
        <div class="loading-text"></div>
    </div>
</body>
</html>
